<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 시안 A: 현수교 — PC(왼쪽 점)와 서버(오른쪽 점)를 잇는 다리 + 아래 프롬프트 >_ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22417a"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- 매달린 줄 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="84" y1="105" x2="84" y2="146"/>
    <line x1="128" y1="90" x2="128" y2="146"/>
    <line x1="172" y1="105" x2="172" y2="146"/>
  </g>
  <!-- 아치(주 케이블)와 상판 -->
  <path d="M40 150 Q128 30 216 150" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="30" y1="150" x2="226" y2="150" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- 양 끝 연결점 -->
  <circle cx="40" cy="150" r="14" fill="#4f8cff" stroke="#ffffff" stroke-width="5"/>
  <circle cx="216" cy="150" r="14" fill="#4f8cff" stroke="#ffffff" stroke-width="5"/>
  <!-- 프롬프트 >_ -->
  <path d="M94 180 L116 197 L94 214" fill="none" stroke="#7fb0ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="128" y1="214" x2="164" y2="214" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
